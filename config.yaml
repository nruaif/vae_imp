model:
  f: 16
  d_enc: 128
  d_dec: 128
  num_groups: 16
  channels_per_group: 14
  use_quant: true
  dropout: 0.0

training:
  image_size: 256
  batch_size: 32
  num_workers: 4
  learning_rate: 0.0001
  warmup_steps: 1000
  max_train_steps: 5000000
  output_dir: ./outputs
  max_checkpoints: 5
  resume_from: null
  log_every_steps: 1
  save_image_every_steps: 5000
  wandb_project: qwen-rvq-vae
  use_masking: true

data:
  webdataset_url: "/root/data/{00000..00204}.tar"
  csv_path: "characters.csv"

projection:
  enabled: true
  hidden_dim: 1024
  output_dim: 1024
  weight: 0.1
