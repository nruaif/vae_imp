model:
  f: 16
  d_enc: 128
  d_dec: 128
  num_groups: 16
  channels_per_group: 14
  use_quant: false
  dropout: 0.0

training:
  image_size: 256
  batch_size: 16
  num_workers: 4
  learning_rate: 0.0001
  warmup_steps: 5000
  max_train_steps: 500000
  output_dir: ./outputs
  max_checkpoints: 5
  resume_from: null
  log_every_steps: 100
  save_image_every_steps: 5000
  wandb_project: qwen-rvq-vae
  use_masking: true

data:
  webdataset_url: "./data/{00000..00004}.tar"
  csv_path: "./data/class_map.csv"

projection:
  enabled: true
  hidden_dim: 512
  output_dim: 384
  weight: 0.5
