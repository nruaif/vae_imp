model:
  d_model: 768
  n_head: 12
  n_layer: 24
  dropout: 0.0
  max_seq_len: 512
  latent_dim: 56          # 4 groups × 14 channels
  num_groups: 4
  channels_per_group: 14
  patch_size: 1            # 1 = 1x (1 token/step), 2 = 2x (2 tokens/step)
  diff_layers: 6
  diff_dim: 768
  diff_adanln_layers: 2
  diff_batch_mul: 4        # repeat diff loss to amortize AR forward cost
  class_dropout_prob: 0.1  # tag dropout for CFG
  perturb_rate: 0.0        # binary flip perturbation (0 = off)
  time_schedule: logit_normal
  time_shift: 1.0
  P_std: 0.8
  P_mean: -0.8

training:
  batch_size: 32
  num_workers: 4
  learning_rate: 3.0e-4
  weight_decay: 0.05
  warmup_steps: 2000
  max_train_steps: 500000
  output_dir: ./ar_outputs
  max_checkpoints: 5
  resume_from: null
  log_every_steps: 10
  save_every_steps: 5000
  wandb_project: bitdance-ar
  max_tags: 32
  num_eval_samples: 4
  sample_steps: 50         # diffusion sampling steps for eval
  sample_cfg: 1.5          # CFG scale for eval

data:
  data_dir: ./data
  tag_csv: "C:\\Users\\nRuaif\\PycharmProjects\\nanoWaifu\\characters.csv"

vae:
  checkpoint: "ckpt_step_95000.pth"
  f: 16
  d_enc: 128
  d_dec: 128
  num_groups: 16
  channels_per_group: 14
